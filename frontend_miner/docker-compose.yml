version: '3.8'

services:
  miner-rs:
    build:
      context: ..
      dockerfile: frontend_miner/Dockerfile
    ports:
      - "49000:80"
    environment:
      - BACKEND_URL=http://miner-rs:3213
    networks:
      - miner-net
    restart: unless-stopped

networks:
  miner-net:
    name: shared-net